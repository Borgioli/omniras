name: Recover Pages deployment
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages-recovery.yml]
permissions:
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel timed-out Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          url = 'https://api.github.com/repos/Borgioli/omniras/pages/deployments/2eb3fb2557597df0b460580077db61d19f93738e/cancel'
          request = urllib.request.Request(url, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              print('Cancellation status:', response.status)
          PY
